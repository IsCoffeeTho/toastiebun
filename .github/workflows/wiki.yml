name: Publish Wiki

on:
  release:
    types: [published]

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    name: Update wiki
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install tools and dependancies
        run: bun install
      - name: Create Wiki files
        run: bun run wiki
      - name: Wiki Push
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: "./wiki"
          token: ${{ secrets.GITHUB_TOKEN }}
