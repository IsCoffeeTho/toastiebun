name: Unit Test

on: push

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependancies
        run: bun install
      - name: Link Check "package.json"
        run: bunx jsonlint package.json
      - name: Type Checking
        run: bun check
      - name: Run Unit-tests
        run: bun test
        
